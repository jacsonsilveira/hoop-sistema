<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hoop · Shell e Meu trabalho</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* === Paleta do design system Hoop === */
  --gray-900:#080808; --gray-800:#101010; --gray-700:#181818; --gray-600:#202020;
  --gray-500:#282828; --gray-400:#464646; --gray-300:#636363; --gray-200:#818181;
  --gray-150:#9E9E9E; --gray-120:#ADADAD;
  /* neutros claros: ausentes no PDF, derivados para superfícies de app */
  --gray-100:#D6D6D6; --gray-75:#E6E6E6; --gray-50:#F2F2F2; --gray-25:#F8F8F8; --white:#FFFFFF;

  --primary-900:#201452; --primary-800:#37257B; --primary-700:#4D37A5; --primary-600:#6448CE;
  --primary-500:#7A5AF8; --primary-400:#957BF9; --primary-300:#AF9CFB; --primary-200:#CABDFC;
  --primary-100:#E4DEFE; --primary-50:#F2EFFE;

  --secondary-700:#1C5696; --secondary-500:#2E90FA; --secondary-200:#ABD3FD; --secondary-50:#EAF4FF;
  --tertiary-700:#932A74; --tertiary-500:#EE46BC; --tertiary-200:#F8B5E4; --tertiary-50:#FDEDF8;

  --success-700:#0C7A13; --success-500:#0F9918; --success-200:#9FD6A3; --success-100:#CFEBD1; --success-50:#EDF7EE;
  --warning-700:#995200; --warning-500:#FF8800; --warning-200:#FFCF99; --warning-100:#FFE7CC; --warning-50:#FFF3E6;
  --error-700:#892929;   --error-500:#E54545;   --error-200:#F5B5B5;   --error-100:#FADADA;   --error-50:#FCECEC;

  /* === Papéis semânticos === */
  --bg:var(--gray-25); --panel:var(--white); --sunken:var(--gray-50);
  --line:var(--gray-75); --line-2:var(--gray-100);
  --ink:var(--gray-500); --ink-2:var(--gray-300); --ink-3:var(--gray-200);
  --brand:var(--primary-500); --brand-soft:var(--primary-50); --brand-ink:var(--primary-700);
  --focus:var(--primary-500);

  /* === Tipografia === */
  --sans:"Poppins",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  --fs-h5:32px; --fs-h6:24px; --fs-sub1:24px; --fs-sub2:20px; --fs-sub3:16px; --fs-sub4:14px;
  --fs-body:16px; --fs-sm:14px; --fs-tiny:12px;
  /* papéis na interface */
  --t-pagina:22px;   /* título da tela */
  --t-numero:28px;   /* número de cartão de métrica */
  --t-secao:16px;    /* título de bloco e de grupo */
  --t-item:14px;     /* título de cartão, linha de tabela, item de lista */
  --t-corpo:14px;    /* texto de leitura */
  --t-meta:12px;     /* apoio, subtítulo, data */
  --t-micro:11px;    /* rótulo de coluna, selo */
  --leitura:72ch;
  --lh-tight:1.25; --lh-body:1.5;

  /* === Espaçamento (grid suave de 4px) === */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px; --s8:32px;
  --s10:40px; --s12:48px; --s18:72px; --s24:96px;
  --container:1320px; --gutter:24px;

  /* === Forma e elevação === */
  --r:8px; --r-sm:6px; --r-lg:12px; --r-pill:999px;
  --sh-1:0 1px 2px rgba(8,8,8,.06); --sh-2:0 4px 12px rgba(8,8,8,.08); --sh-3:0 12px 32px rgba(8,8,8,.14);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:var(--gray-900); --panel:var(--gray-700); --sunken:var(--gray-600);
  --line:var(--gray-600); --line-2:var(--gray-400);
  --ink:#EDEDED; --ink-2:#B4B4B4; --ink-3:var(--gray-200);
  --brand-soft:var(--primary-900); --brand-ink:var(--primary-300);
}}
:root[data-theme="dark"]{
  --bg:var(--gray-900); --panel:var(--gray-700); --sunken:var(--gray-600);
  --line:var(--gray-600); --line-2:var(--gray-400);
  --ink:#EDEDED; --ink-2:#B4B4B4; --ink-3:var(--gray-200);
  --brand-soft:var(--primary-900); --brand-ink:var(--primary-300);
}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:var(--fs-sm);line-height:var(--lh-body);-webkit-font-smoothing:antialiased}
h1,h2,strong,b{font-weight:600;letter-spacing:-.01em}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:var(--r-sm)}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.nav-i:focus-visible{outline-offset:-2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;background:var(--panel);border:1px solid var(--line-2);border-radius:var(--r-sm);padding:0 16px;height:38px;font:inherit;font-size:var(--t-item);font-weight:500;line-height:1;white-space:nowrap;cursor:pointer;transition:background .12s,border-color .12s,box-shadow .12s}
.btn:hover{background:var(--sunken);border-color:var(--gray-150)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn:active{transform:translateY(.5px)}
.btn.primary:focus-visible{box-shadow:0 0 0 3px var(--primary-100)}
.btn.primary{background:var(--brand);color:var(--white);border-color:var(--brand)}
.btn.primary:hover{background:var(--primary-600);border-color:var(--primary-600)}
.btn.soft{background:var(--brand-soft);color:var(--brand-ink);border-color:transparent}
.btn.danger{background:var(--error-500);color:var(--white);border-color:var(--error-500)}
.btn.sm{height:32px;padding:0 12px;font-size:var(--t-meta);gap:6px}
.btn .ic{flex:none}
.hint{color:var(--ink-3);font-size:var(--fs-tiny)}
.ic{width:20px;height:20px;flex:none;display:inline-block;vertical-align:-4px}
.ic{fill:currentColor;color:currentColor}
.nota{font-size:10px;line-height:1.45;color:var(--primary-400);font-style:italic;margin-top:5px;max-width:64ch;display:block}
.nota::before{content:"nota do protótipo · ";font-style:normal;font-weight:600;letter-spacing:.03em;text-transform:uppercase;font-size:9px;opacity:.85}
.nota strong{font-weight:600}
body.sem-notas .nota:not(.bloco-nota){display:none}
.nota.bloco-nota{background:var(--brand-soft);border:1px solid var(--primary-200);border-radius:var(--r-sm);padding:10px 12px;margin:14px 0;color:var(--brand-ink);font-style:normal;font-size:var(--t-meta)}
.nota.bloco-nota::before{content:""}


.ic.sm{width:16px;height:16px;vertical-align:-3px}
.ic.lg{width:24px;height:24px;vertical-align:-5px}
.tag{display:inline-block;border:1px solid var(--line-2);border-radius:var(--r-pill);padding:2px 10px;font-size:var(--fs-tiny);font-weight:500;color:var(--ink-2);background:var(--panel)}
.tag.fill,.tag[data-tom="ativo"]{background:var(--brand-soft);color:var(--brand-ink);border-color:var(--primary-200)}
.tag.dash,.tag[data-tom="atencao"]{background:var(--warning-50);color:var(--warning-700);border-color:var(--warning-200)}
.tag.ok,.tag[data-tom="ok"]{background:var(--success-50);color:var(--success-700);border-color:var(--success-200)}
.tag.erro,.tag[data-tom="risco"]{background:var(--error-50);color:var(--error-700);border-color:var(--error-200)}
.tag[data-tom="espera"]{background:var(--secondary-50);color:var(--secondary-700);border-color:var(--secondary-200)}
.tag[data-tom="neutro"]{background:var(--sunken);color:var(--ink-2);border-color:var(--line-2)}
.barra i[data-tom="risco"]{background:var(--error-500)}
.barra i[data-tom="atencao"]{background:var(--warning-500)}
.barra i[data-tom="ok"]{background:var(--success-500)}
.barra i[data-tom="espera"]{background:var(--secondary-500)}
.barra i[data-tom="neutro"]{background:var(--gray-150)}
.av{display:inline-flex;align-items:center;justify-content:center;border-radius:var(--r-pill);color:var(--white);font-weight:600;flex:none;letter-spacing:0}
.av.xs{width:20px;height:20px;font-size:9px}
.av.sm{width:24px;height:24px;font-size:10px}
.av.md{width:32px;height:32px;font-size:12px}
.av.lg{width:44px;height:44px;font-size:15px}
.av.xl{width:72px;height:72px;font-size:22px}
.av.logo{background:var(--panel);border:1px solid var(--line-2);color:var(--ink-2)}
.avs{display:inline-flex;align-items:center;gap:6px}
.avs .pilha{display:inline-flex}
.avs .pilha .av+.av{margin-left:-7px;box-shadow:0 0 0 2px var(--panel)}
.ph{background:var(--sunken);border:1px dashed var(--line-2);display:flex;align-items:center;justify-content:center;color:var(--ink-3);font-size:11px;font-family:var(--mono)}

/* shell */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.side{background:var(--panel);border-right:1px solid var(--line);padding:14px 10px;position:sticky;top:0;height:100vh;overflow:auto}
.side .marca{display:flex;align-items:center;gap:8px;padding:4px 8px 14px}
.side .marca b{font-size:var(--fs-sub3);letter-spacing:-.02em}
.nav-g{margin-bottom:14px}
.nav-t{font-size:10px;letter-spacing:.08em;color:var(--ink-3);padding:0 10px 8px;text-transform:uppercase;font-weight:600}
.nav-i{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-radius:var(--r-sm);padding:8px 10px;cursor:pointer;color:var(--ink-2);font-size:var(--fs-sm)}
.nav-i:hover{background:var(--sunken)}
.nav-i[aria-current="page"]{background:var(--brand-soft);color:var(--brand-ink);font-weight:600}
.nav-i .ic{opacity:.75}
.nav-i:hover .ic,.nav-i[aria-current="page"] .ic{opacity:1}
.nav-i .pt{width:16px;text-align:center;opacity:.8;font-size:12px}
.nav-i .cont{margin-left:auto;font-size:11px;color:var(--ink-3)}
.nav-i[aria-current="page"] .cont{color:var(--brand-ink);opacity:.8}
.side .rodape{border-top:1px solid var(--line);margin-top:10px;padding-top:10px}

.topo{display:flex;gap:12px;align-items:center;padding:12px 20px;min-height:62px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:20}
.topo h1{font-size:var(--t-pagina);margin:0;font-weight:600;letter-spacing:-.025em;line-height:1.2}
.busca{flex:1;max-width:420px;position:relative}
.busca input{width:100%;background:var(--sunken);border:1px solid var(--line-2);border-radius:var(--r);padding:8px 10px 8px 30px}
.busca .lupa{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--ink-3)}
.topo .dir{margin-left:auto;display:flex;gap:8px;align-items:center}
.sino{position:relative;background:var(--panel);border:1px solid var(--line-2);border-radius:var(--r);padding:6px 10px;cursor:pointer}
.sino .n{position:absolute;top:-6px;right:-6px;background:var(--error-500);color:var(--white);border-radius:var(--r-pill);font-size:10px;font-weight:600;padding:1px 5px}
.painel-not{position:absolute;right:20px;top:58px;width:min(380px,92vw);background:var(--panel);border:1px solid var(--line-2);border-radius:var(--r);z-index:40;max-height:70vh;overflow:auto}
.not-i{display:flex;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer;text-align:left;background:none;border-left:0;border-right:0;border-top:0;width:100%;color:inherit}
.not-i:hover{background:var(--sunken)}
.not-i.novo{background:var(--brand-soft)}
.ponto{display:inline-block;width:7px;height:7px;border-radius:var(--r-pill);background:var(--brand)}
.conteudo{padding:24px 28px 56px;max-width:none}
.conteudo>p,.conteudo>.hint,.bloco>textarea,.bloco>p{max-width:var(--leitura)}
@media(max-width:700px){.conteudo{padding:16px}}

/* meu trabalho */
.filtros{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:16px;min-height:34px}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:var(--r-sm);overflow:hidden;height:32px}
.seg button{display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:0;border-right:1px solid var(--line-2);padding:0 14px;font:inherit;font-size:var(--t-meta);font-weight:500;color:var(--ink-2);cursor:pointer}
.seg button:last-child{border-right:0}
.seg button:hover{background:var(--sunken)}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--white)}
.grupo-t{display:flex;align-items:baseline;gap:10px;margin:24px 0 10px}
.grupo-t h2{font-size:var(--t-secao);margin:0;font-weight:600;letter-spacing:-.015em}
.dem{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:8px;width:100%;text-align:left;cursor:pointer;color:inherit;font:inherit}
.dem:hover{border-color:var(--line-2)}
.dem.atrasada{border-left:3px solid var(--error-500)}
.dem .l1{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.dem .tit{font-weight:600;font-size:var(--t-item)}
.dem .meta{font-size:12px;color:var(--ink-3);margin-top:2px}
.dem .prog{display:flex;align-items:center;gap:8px;min-width:150px;justify-content:flex-end}
.barra{display:inline-block;flex:1;min-width:52px;max-width:120px;height:8px;background:var(--gray-100);border-radius:var(--r-pill);overflow:hidden;vertical-align:middle}
.barra i{transition:width .2s}
.barra i{display:block;height:100%;background:var(--brand);border-radius:var(--r-pill)}
.vazio{border:1px dashed var(--line-2);border-radius:var(--r);padding:24px;text-align:center;color:var(--ink-3)}
.kb{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kb-col{background:var(--sunken);border:1px solid var(--line);border-radius:var(--r);padding:8px;min-height:120px}
.kb-t{font-size:var(--t-micro);color:var(--ink-3);padding:4px 4px 10px;display:flex;justify-content:space-between;text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.kb .dem{grid-template-columns:1fr;padding:10px}
@media(max-width:1000px){.kb{grid-template-columns:1fr 1fr}}
.hamb{display:none;background:none;border:0;padding:6px;cursor:pointer;color:var(--ink);border-radius:var(--r-sm)}
.hamb:hover{background:var(--sunken)}
.scrim-menu{display:none}

/* tablet e celular: menu vira gaveta */
@media(max-width:1000px){
  .app{grid-template-columns:1fr}
  .hamb{display:inline-flex}
  .side{position:fixed;top:0;left:0;bottom:0;width:260px;z-index:60;transform:translateX(-100%);transition:transform .2s ease;box-shadow:var(--sh-3)}
  body.menu-on .side{transform:none}
  body.menu-on .scrim-menu{display:block;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50}
  .conteudo{padding:18px 16px 48px}
  .topo{padding:10px 14px;gap:8px}
  .topo h1{font-size:var(--fs-sub3)}
  .busca{max-width:none}
  .kb{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:10px}
  .form3{grid-template-columns:1fr 1fr}
  .cards{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
}

/* celular: coluna única, tabela vira cartão, modal vira folha */
@media(max-width:700px){
  .topo .btn{display:none}
  .busca input{font-size:var(--t-item)}
  .kb{grid-template-columns:1fr!important}
  .form3,.linhas{grid-template-columns:1fr}
  .grade-cards{grid-template-columns:1fr}
  .tabela .tr,.tabela .tr.c4,.tabela .tr.c5{grid-template-columns:1fr!important;row-gap:4px;padding:14px}
  .tabela .tr.th{display:none}
  .tabela .tr>span:first-child{font-size:var(--t-item);font-weight:600}
  .abas{overflow-x:auto;flex-wrap:nowrap}
  .cal{grid-auto-rows:minmax(84px,1fr);gap:3px}
  .cal-p{font-size:9px;padding:3px 4px}
  .cal-p .ic{display:none}
  .citem{grid-template-columns:22px minmax(0,1fr) auto}
  .citem .mini{font-size:10px}
  .dtopo{grid-template-columns:20px 1fr auto!important}
  .sub-topo{flex-wrap:wrap}
  .side{width:80vw}
}

/* tabelas e abas */
.tabela{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--panel);box-shadow:var(--sh-1)}
.tabela+.tabela{margin-top:14px}
.tr{display:grid;grid-template-columns:2fr 1fr 1fr 1fr 1fr 70px;gap:14px;align-items:center;padding:12px 16px;min-height:52px;font-size:var(--t-item);border-bottom:1px solid var(--line);width:100%;text-align:left;background:none;border-left:0;border-right:0;border-top:0;color:inherit;font:inherit;cursor:pointer}
.tr.c4{grid-template-columns:2fr 1fr 1fr 1fr}
.tr.c5{grid-template-columns:2fr 1fr 2fr 1fr 1fr}
.tr:last-child{border-bottom:0}
.tr.th{background:var(--sunken);min-height:0;padding:10px 16px;font-size:var(--t-micro);color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em;font-weight:600;cursor:default}
.tr.th:hover{background:var(--sunken)}
button.tr:hover{background:var(--brand-soft)}
.tr:focus-visible{outline:2px solid var(--brand);outline-offset:-2px}
.tr:last-child{border-bottom:0}
.tr>span{min-width:0}

/* célula: título forte + apoio legível, ambos cortados com reticências */
.cel{display:flex;flex-direction:column;gap:2px;min-width:0}
.cel-t{font-weight:600;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cel-s{font-size:var(--t-meta);color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cel-num{font-variant-numeric:tabular-nums}
.val{justify-self:end;text-align:right;font-variant-numeric:tabular-nums}
.campo{position:relative}
.campo input[data-ok="nao"]{border-color:var(--error-500);box-shadow:0 0 0 3px var(--error-50)}
.campo input[data-ok="sim"]{border-color:var(--success-500)}
.campo-msg{font-size:var(--t-micro);margin-top:4px;display:flex;gap:5px;align-items:center}
.campo-msg[data-tom="risco"]{color:var(--error-700)}
.campo-msg[data-tom="ok"]{color:var(--success-700)}
.campo-msg[data-tom="neutro"]{color:var(--ink-3)}
.campo .buscando{opacity:.6}
.cel-prog{display:flex;align-items:center;gap:9px;min-width:0}
.cel-prog .hint{flex:none;font-variant-numeric:tabular-nums}
.tr-grupo{display:flex;gap:10px;align-items:center;padding:10px 16px;background:var(--sunken);border-bottom:1px solid var(--line);border-top:1px solid var(--line);font-size:var(--t-meta);color:var(--ink-2)}
.tr-grupo:first-of-type{border-top:0}
.abas{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin:14px 0 16px}
.aba{background:none;border:0;border-bottom:2px solid transparent;padding:10px 12px;cursor:pointer;color:var(--ink-2);font-size:var(--t-item);font-weight:500}
.aba:hover{color:var(--ink)}
.aba[aria-current="true"]{color:var(--brand);border-bottom-color:var(--brand);font-weight:600}
.form3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media(max-width:760px){.form3{grid-template-columns:1fr 1fr}}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(176px,1fr));gap:12px;margin-bottom:18px}
.cardinho{border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;background:var(--panel);box-shadow:var(--sh-1);display:flex;flex-direction:column;justify-content:flex-start}
.cardinho .hint{font-size:var(--t-micro);text-transform:uppercase;letter-spacing:.05em}
.cardinho>strong{display:block;font-size:var(--t-numero);line-height:1.15;margin-top:6px;letter-spacing:-.02em}
.cardinho>strong+.hint{text-transform:none;letter-spacing:0;font-size:var(--t-meta);margin-top:4px}
.bloco{border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;background:var(--panel);margin-bottom:16px;box-shadow:var(--sh-1)}
.bloco-t{font-size:var(--t-micro);color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em;font-weight:600;margin-bottom:12px}
.linhas{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
.linhas .hint{font-size:var(--t-micro);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.linhas>div>div{font-size:var(--t-item);margin-top:3px}
.pastas{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}

select.sit:hover{filter:brightness(.97)}
.tr.clicavel{cursor:pointer}
.tr.clicavel:focus-visible{outline:2px solid var(--brand);outline-offset:-2px}
input.inline{border-color:transparent;background:var(--panel)}
input.inline:hover{border-color:var(--line-2);background:var(--sunken)}
.massa{position:sticky;top:62px;z-index:15;display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap;background:var(--brand-soft);border:1px solid var(--primary-200);border-radius:var(--r);padding:14px 16px;margin-bottom:14px;box-shadow:var(--sh-1)}
.massa .btn{align-self:flex-end}
.massa strong{color:var(--brand-ink);align-self:center}
.vazio-ensina{border:1px dashed var(--line-2);border-radius:var(--r-lg);padding:40px 24px;text-align:center;background:var(--panel)}
.sel-box{accent-color:var(--brand);width:16px;height:16px}
.kcard.marcado{border-color:var(--brand);box-shadow:0 0 0 2px var(--primary-100)}
.chave{width:44px;height:26px;border-radius:var(--r-pill);border:1px solid var(--line-2);background:var(--sunken);position:relative;cursor:pointer;flex:none;transition:background .15s,border-color .15s}
.chave span{position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:var(--r-pill);background:var(--white);box-shadow:var(--sh-1);transition:transform .15s}
.chave.on{background:var(--brand);border-color:var(--brand)}
.chave.on span{transform:translateX(18px)}
kbd{font-family:var(--mono);font-size:var(--t-micro);background:var(--sunken);border:1px solid var(--line-2);border-bottom-width:2px;border-radius:5px;padding:3px 7px}
.paleta{position:fixed;top:12vh;left:50%;transform:translateX(-50%);width:min(620px,94vw);background:var(--panel);border:1px solid var(--line-2);border-radius:var(--r-lg);box-shadow:var(--sh-3);z-index:70;overflow:hidden}
.pal-topo{display:flex;gap:10px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.pal-topo input{flex:1;border:0;background:none;font:inherit;font-size:var(--fs-sub3);color:inherit}
.pal-topo input:focus{outline:none}
.pal-lista{max-height:52vh;overflow:auto;padding:6px}
.pal-g{font-size:var(--t-micro);text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:600;padding:10px 10px 4px}
.pal-i{display:flex;gap:10px;align-items:center;width:100%;background:none;border:0;border-radius:var(--r-sm);padding:9px 10px;cursor:pointer;color:inherit;font:inherit;font-size:var(--t-item);text-align:left}
.pal-i.sel,.pal-i:hover{background:var(--brand-soft);color:var(--brand-ink)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--gray-600);color:var(--white);padding:12px 18px;border-radius:var(--r);z-index:60;font-size:var(--fs-sm);box-shadow:var(--sh-3)}
/* ===== escala de espaçamento: 4 passos, nada fora ===== */
:root{--e1:8px;--e2:12px;--e3:16px;--e4:24px}
.u-mt1{margin-top:var(--e1)}.u-mt2{margin-top:var(--e2)}.u-mt3{margin-top:var(--e3)}.u-mt4{margin-top:var(--e4)}
.u-linha{display:flex;gap:var(--e1);align-items:center}
.u-linha-2{display:flex;gap:var(--e2);align-items:center}
.u-quebra{flex-wrap:wrap}
.u-fim{margin-left:auto}
.u-col{display:flex;flex-direction:column;gap:var(--e1);min-width:0}
.u-grade{display:grid;gap:var(--e2)}
.u-2{grid-template-columns:1fr 1fr}.u-3{grid-template-columns:repeat(3,1fr)}
@media(max-width:700px){.u-2,.u-3{grid-template-columns:1fr}}

/* ===== cartão em três níveis ===== */
.card{border-radius:var(--r);background:var(--panel)}
.card[data-nivel="plano"]{background:none;padding:0}
.card[data-nivel="padrao"]{border:1px solid var(--line);padding:var(--e3) 18px}
.card[data-nivel="alto"]{border:1px solid var(--line);padding:var(--e3) 18px;box-shadow:var(--sh-2)}
.card-t{font-size:var(--t-secao);font-weight:600;letter-spacing:-.015em;margin-bottom:var(--e2);display:flex;align-items:baseline;gap:var(--e1)}

/* ===== métrica: um número manda, o resto acompanha ===== */
/* ritmo vertical: nenhum bloco encosta no próximo */
#conteudo>.tabela,#conteudo>.cards,#conteudo>.graf-grid,#conteudo>.quadro-plan,#conteudo>.vazio-ensina{margin-bottom:var(--e3)}
.tabela+.tabela,.tabela+.bloco,.tabela+.cards,.tabela+.graf-grid,
.cards+.tabela,.cards+.bloco,.cards+.graf-grid,
.graf-grid+.tabela,.graf-grid+.bloco,.graf-grid+.cards,
.faixa+.tabela,.faixa+.bloco,.faixa+.cards,.faixa+.graf-grid,
.metrica-topo+.tabela,.metrica-topo+.bloco,.metrica-topo+.cards,.metrica-topo+.graf-grid,
.destaque+.tabela,.destaque+.bloco,.vazio-ensina+*{margin-top:var(--e3)}
#conteudo>*:last-child{margin-bottom:0}
.metrica-topo{display:grid;grid-template-columns:minmax(260px,1.1fr) 2fr;gap:var(--e3);margin-bottom:var(--e3);align-items:stretch}
@media(max-width:860px){.metrica-topo{grid-template-columns:1fr}}
.destaque{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);padding:20px;display:flex;flex-direction:column;justify-content:center;gap:4px;box-shadow:var(--sh-1)}
.destaque .rot{font-size:var(--t-micro);text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:600}
.destaque .num{font-size:34px;font-weight:600;letter-spacing:-.03em;line-height:1.05}
.destaque .num[data-tom="ok"]{color:var(--success-700)}
.destaque .num[data-tom="risco"]{color:var(--error-700)}
.destaque .num[data-tom="atencao"]{color:var(--warning-700)}
.destaque .num[data-tom="espera"]{color:var(--secondary-700)}
.destaque .apoio{font-size:var(--t-meta);color:var(--ink-2)}
.faixa{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:1px;border:1px solid var(--line);border-radius:var(--r);background:var(--line);overflow:hidden;margin-bottom:var(--e3)}
.faixa-i{padding:14px 16px;background:var(--panel);display:flex;flex-direction:column;gap:3px;min-width:0}
.metrica-topo>.faixa{margin-bottom:0}
.faixa-i .rot{font-size:var(--t-micro);text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.faixa-i .num{font-size:19px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.faixa-i .num[data-tom="ok"]{color:var(--success-700)}
.faixa-i .num[data-tom="risco"]{color:var(--error-700)}
.faixa-i .num[data-tom="atencao"]{color:var(--warning-700)}
.faixa-i .num[data-tom="espera"]{color:var(--secondary-700)}
@media(max-width:700px){.faixa{grid-template-columns:1fr 1fr}}

/* ===== apoio sob demanda, no lugar de legenda em tudo ===== */
.ajuda{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:var(--r-pill);border:1px solid var(--line-2);color:var(--ink-3);font-size:10px;font-weight:700;cursor:help;position:relative;flex:none}
.ajuda:hover{border-color:var(--brand);color:var(--brand)}
.ajuda::after{content:attr(data-txt);position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);width:max-content;max-width:280px;background:var(--ink);color:var(--white);font-size:var(--t-micro);font-weight:400;line-height:1.45;padding:8px 10px;border-radius:var(--r-sm);opacity:0;pointer-events:none;transition:opacity .12s;z-index:60;text-align:left;box-shadow:var(--sh-2)}
.ajuda:hover::after,.ajuda:focus-visible::after{opacity:1}

/* ===== micro-interações ===== */
#conteudo{animation:entra .18s ease}
@keyframes entra{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.carregando{position:relative;color:transparent!important}
.carregando::after{content:"";position:absolute;inset:0;border-radius:var(--r-sm);background:linear-gradient(90deg,var(--sunken),var(--gray-100),var(--sunken));background-size:200% 100%;animation:brilho 1.1s infinite}
@keyframes brilho{from{background-position:200% 0}to{background-position:-200% 0}}
.girando{animation:gira .8s linear infinite;display:inline-block}
@keyframes gira{to{transform:rotate(360deg)}}
.tr .acoes-linha{opacity:0;transition:opacity .12s}
.tr:hover .acoes-linha,.tr:focus-within .acoes-linha{opacity:1}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}


/* ===== modal de trabalho: largura e colunas, depois da regra base ===== */
@media(max-width:1099px){
  .modal.duplo{width:min(880px,96vw)}
  .m-duplo{grid-template-columns:minmax(0,1fr)}
}
@media(min-width:1100px){
  .modal.duplo{width:min(1220px,96vw)}
  .m-duplo{grid-template-columns:minmax(0,1fr) 340px;gap:var(--e4);align-items:stretch}
  .m-conversa{border-top:0;border-left:1px solid var(--line);padding:0 0 0 var(--e4)}
  .m-conversa .conv-corpo{overflow:auto;flex:1;padding-right:6px}
}
@media(min-width:1600px){.modal.duplo{width:1440px}}
@media(max-width:1000px){.modal{width:min(96vw,760px);padding:18px}}
@media(max-width:700px){
  .modal{top:auto;bottom:0;left:0;transform:none;width:100%;max-width:none;max-height:92vh;border-radius:var(--r-lg) var(--r-lg) 0 0;padding:18px 16px 28px}
}
@media(max-width:700px){
  .modal.duplo{top:auto;bottom:0;left:0;transform:none;width:100%;max-width:none;max-height:94vh;border-radius:var(--r-lg) var(--r-lg) 0 0}
  .modal.duplo>.mtopo,.modal.duplo>.m-duplo,.modal.duplo>.acoes{padding-left:16px;padding-right:16px}
}
</style>

function montarHistorico(){
  HIST_MES=MESES_2026.map(m=>{
    const ls=LANC.filter(l=>mesDe(l.d)===m);
    const rec=ls.filter(l=>l.t==="receita");
    return {mes:m,bruto:rec.reduce((a,l)=>a+l.v,0),taxa:rec.reduce((a,l)=>a+taxaDe(l),0),
      desp:ls.filter(l=>l.t==="despesa").reduce((a,l)=>a+l.v,0)};
  });
}

};

function noPeriodo(t,data){
  const f=filtrosDe(t); if(!f.per)return true;
  const iso=paraISO(data); if(!iso)return true;
  const d=new Date(iso+"T00:00:00"), hoje=new Date(2026,8,23);
  if(f.per==="mes")return d.getMonth()===hoje.getMonth()&&d.getFullYear()===hoje.getFullYear();

  if(f.per==="3m"){const lim=new Date(2026,5,23);return d>=lim&&d<=hoje}
  if(f.per==="ano")return d.getFullYear()===hoje.getFullYear();
  if(f.per==="custom"){
    if(f.de&&iso<f.de)return false;
    if(f.ate&&iso>f.ate)return false;

}

function ordenar(lista,t,mapa){
  const o=ordDe(t); if(!o.campo||!mapa[o.campo])return lista;
  const fn=mapa[o.campo];
  return [...lista].sort((a,b)=>{
    const x=fn(a),y=fn(b);
    let r; if(typeof x==="number"&&typeof y==="number")r=x-y;
    else r=String(x??"").localeCompare(String(y??""),"pt-BR",{numeric:true});
    return o.dir==="desc"?-r:r});
}

/* CNPJ alfanumérico: 12 posições alfanuméricas + 2 dígitos verificadores */
function mCNPJ(v){
  let s=String(v||"").toUpperCase().replace(/[^0-9A-Z]/g,"").slice(0,14);
  const base=s.slice(0,12), dv=s.slice(12).replace(/\D/g,"");
  let out=base.replace(/^(.{2})(.)/,"$1.$2").replace(/^(.{2}\..{3})(.)/,"$1.$2").replace(/^(.{2}\..{3}\..{3})(.)/,"$1/$2");
  if(dv)out+="-"+dv;
  return out;
}
const valorCar=c=>c.charCodeAt(0)-48;           // "0"→0 … "A"→17, como manda a regra alfanumérica
function validaCNPJ(v){
  const s=String(v||"").toUpperCase().replace(/[^0-9A-Z]/g,"");
  if(s.length!==14)return false;
  if(!/^\d{2}$/.test(s.slice(12)))return false;
  const dig=(len)=>{
    let peso=2,soma=0;
    for(let i=len-1;i>=0;i--){soma+=valorCar(s[i])*peso;peso=peso===9?2:peso+1}
    const r=soma%11; return r<2?0:11-r;
  };
  return dig(12)===+s[12]&&dig(13)===+s[13];
}
function validaCPF(v){
  const s=soNum(v); if(s.length!==11||/^(\d)\1{10}$/.test(s))return false;
  const dig=len=>{let soma=0;for(let i=0;i<len;i++)soma+=+s[i]*(len+1-i);
    const r=(soma*10)%11; return r===10?0:r};
  return dig(9)===+s[9]&&dig(10)===+s[10];
}
const fracao=v=>{const n=parseFloat(String(v||"").replace("%","").replace(/\./g,"").replace(",","."));return isNaN(n)?null:n/100};
function mPerc(v){const n=soNum(v).slice(0,4);if(!n)return "";return (Number(n)/10).toLocaleString("pt-BR",{minimumFractionDigits:1})+"%"}
function mHoras(v){const n=soNum(v).slice(0,3);return n?n+"h":""}
function mUser(v){return String(v||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9._]/g,"")}
function mEmail(v){return String(v||"").toLowerCase().replace(/\s/g,"")}
function mSite(v){return String(v||"").toLowerCase().replace(/\s/g,"")}
function mArroba(v){const s=String(v||"").toLowerCase().replace(/[^a-z0-9._@]/g,"").replace(/@+/g,"");return s?"@"+s:""}
function mDias(v){const n=soNum(v).slice(0,3);return n?n+" dias":""}
function mParc(v){const n=soNum(v).slice(0,2);return n?n+"x":""}
function mDia(v){let n=+soNum(v).slice(0,2);if(!n)return "";n=Math.min(31,Math.max(1,n));return String(n)}
function mMesAno(v){const n=soNum(v).slice(0,6);
  if(n.length<=2)return n;
  return n.replace(/(\d{2})(\d{0,4})/,"$1/$2")}
function mConta(v){const n=soNum(v).slice(0,9);return n.length>1?n.replace(/(\d+)(\d)$/,"$1-$2"):n}
function mAgencia(v){const n=soNum(v).slice(0,5);return n.length>4?n.replace(/(\d{4})(\d)/,"$1-$2"):n}
function tipoPix(v){
  const s=String(v||"").trim();
  if(/^[\w.+-]+@[\w-]+\.[\w.]+$/.test(s))return "email";
  const n=soNum(s);
  if(n.length===11&&validaCPF(n))return "CPF";
  if(s.replace(/[^0-9A-Za-z]/g,"").length===14&&validaCNPJ(s))return "CNPJ";
  if(n.length===11||n.length===10)return "telefone";
  if(s.length===32||s.includes("-"))return "chave aleatória";
  return "";
}

function consultarCNPJ(v){
  const k=String(v||"").toUpperCase().replace(/[^0-9A-Z]/g,"");
  if(CACHE_CNPJ[k])return Promise.resolve(CACHE_CNPJ[k]);
  return new Promise((ok,err)=>setTimeout(()=>{
    const d=BASE_CNPJ[k];
    if(!d)return err(new Error("CNPJ não encontrado na base pública."));
    CACHE_CNPJ[k]=d; ok(d);
  },450));
}
function consultarCEP(v){
  const k=soNum(v);
  if(CACHE_CEP[k])return Promise.resolve(CACHE_CEP[k]);
  return new Promise((ok,err)=>setTimeout(()=>{
    const d=BASE_CEP[k];
    if(!d)return err(new Error("CEP não encontrado."));
    CACHE_CEP[k]=d; ok(d);
  },350));
}

  const pts=[v.length>=8,/[A-Z]/.test(v),/[0-9]/.test(v),/[^A-Za-z0-9]/.test(v)].filter(Boolean).length;

  msg("f-msg",v?`senha ${rot}`:"mínimo de 8 caracteres",v?tom:"neutro");

/* ===== hierarquia de métricas ===== */
function destaque(rot,num,tom,apoio,ajuda){
  return `<div class="destaque">
    <div class="rot">${rot}${ajuda?` <span class="ajuda" tabindex="0" data-txt="${ajuda}">?</span>`:""}</div>
    <div class="num" ${tom?`data-tom="${tom}"`:""}>${num}</div>
    ${apoio?`<div class="apoio">${apoio}</div>`:""}</div>`;
}
function faixa(itens){
  return `<div class="faixa">${itens.filter(Boolean).map(([rot,num,tom,ajuda])=>`<div class="faixa-i">
    <div class="rot">${rot}${ajuda?` <span class="ajuda" tabindex="0" data-txt="${ajuda}">?</span>`:""}</div>
    <div class="num" ${tom?`data-tom="${tom}"`:""}>${num}</div></div>`).join("")}</div>`;
}
const topoMetricas=(d,f)=>`<div class="metrica-topo">${d}${faixa(f)}</div>`;

function cartao(o){
  const pct=o.t?Math.round(o.f/o.t*100):0;
  const tomB=o.tomBarra||"ativo";
  return `<div class="kcard ${o.alerta?"alerta":""} ${o.marcado?"marcado":""}" ${o.drag?`draggable="true" ondragstart="event.dataTransfer.setData('text/plain','${o.drag}')"`:""} onclick="${o.click}">

    <div class="kc-sub">${o.sub||""}</div>
    ${o.t?`<div class="barra" style="width:100%;margin:8px 0 6px"><i data-tom="${tomB}" style="width:${pct}%"></i></div>`:'<div style="height:6px"></div>'}
    <div class="kc-pe">
      ${(o.tags||[]).map(x=>`<span class="tag" data-tom="${x[1]||"neutro"}">${x[0]}</span>`).join("")}
      ${o.t?`<span class="hint">${o.f} de ${o.t}</span>`:""}
      ${o.respIds?`<span class="u-fim">${comAvatar(o.respIds)}</span>`
        :o.resp?`<span class="hint" class="u-fim">${o.resp}</span>`:""}
    </div>
  </div>`;
}

function abrirProjeto(id){S.proj=id;S.ref=null;S.tela="projetos";

const feitosDe=d=>d.subs?d.subs.reduce((a,x)=>a+x.itens.filter(i=>i[3]).length,0):d.itens.filter(i=>i[3]).length;
const totalDe=d=>d.subs?d.subs.reduce((a,x)=>a+x.itens.length,0):d.itens.length;

    andamento:p=>p.demandas.filter(d=>d.st==="concluido").length/p.demandas.length});

    ${lista.map(p=>{const at=p.demandas.find(d=>d.st==="execucao")||p.demandas.find(d=>d.st==="cliente")||{t:"—"};

          f:feitosDe(o.d),t:totalDe(o.d),tomBarra:concl?"ok":tom==="risco"?"risco":tom==="atencao"?"atencao":"ativo",

function listaHTML(p){
  const grupos=COLS.map(([k,r])=>[k,r,p.demandas.map((d,i)=>({d,i})).filter(o=>o.d.st===k)]).filter(g=>g[2].length);

function soltarDem(e,st){
  e.preventDefault();document.querySelectorAll(".kb-col").forEach(x=>x.classList.remove("alvo"));
  const i=+e.dataTransfer.getData("text/plain");
  const p=PROJETOS.find(x=>x.id===S.proj), d=p.demandas[i];
  if(!d||d.st===st)return;
  const antes=d.st; d.st=st;
  if(st==="concluido"&&d.itens)d.itens.forEach(it=>it[3]=1);
  d.log=d.log||[];d.log.unshift({t:`Status: ${ST_PROJ[antes]} para <strong>${ST_PROJ[st]}</strong>, arrastando no kanban`,a:S.eu,q:agora()});
  render();toast(`"${d.t}" movida para ${COLS.find(c=>c[0]===st)[1]}.`);
}

function gBarras(dados,o){
  o=o||{}; const L=44,B=26,T=10,R=8, w=o.w||520,h=o.h||190;
  const max=Math.max(...dados.flatMap(d=>d.slice(1).filter(x=>typeof x==="number")))*1.15||1;

  const grade=[0,.25,.5,.75,1].map(f=>`<line x1="${L}" x2="${w-R}" y1="${y(max*f)}" y2="${y(max*f)}" stroke="var(--line)"/>
    <text x="${L-8}" y="${y(max*f)+3}" text-anchor="end" class="g-eixo">${Math.round(max*f/1000)}k</text>`).join("");
  const barras=dados.map((d,i)=>{
    const x0=L+gw*i+gw/2;
    const s1=`<rect x="${x0-(o.series===2?bw+2:bw/2)}" y="${y(d[1])}" width="${bw}" height="${h-B-y(d[1])}" rx="3" fill="${o.cor1||corTom("ok")}"><title>${d[0]} · ${brl(d[1])}</title></rect>`;
    const s2=o.series===2?`<rect x="${x0+2}" y="${y(d[2])}" width="${bw}" height="${h-B-y(d[2])}" rx="3" fill="${o.cor2||corTom("risco")}"><title>${d[0]} · ${brl(d[2])}</title></rect>`:"";
    return s1+s2+`<text x="${x0}" y="${h-8}" text-anchor="middle" class="g-eixo">${d[0]}</text>`;
  }).join("");

}
function gLinha(dados,o){

function gRosca(dados,o){

}

/* RBT12: receita bruta dos 12 meses anteriores ao mês de apuração */
function rbt12(mes){
  const [m,a]=mes.split("/").map(Number);
  let soma=0;
  for(let i=1;i<=12;i++){
    const d=new Date(a,m-1-i,1);
    const k=dd(d.getMonth()+1)+"/"+d.getFullYear();
    soma+=HIST_MES.filter(x=>x.mes===k).reduce((s,x)=>s+x.bruto,0);
  }
  return soma;
}

const guiaDoMes=m=>GUIAS.find(g=>g.mes===m);
/* alíquota efetiva apurada: guia dividida pela receita bruta daquele mês */
function aliquotaApurada(m){
  const g=guiaDoMes(m), b=brutoDoMes(m);
  return g&&b?Math.round(g.valor/b*1000000)/1000000:null;
}
/* enquanto a guia não chega, provisiona com a alíquota do mês anterior */
function mesAnterior(m){const [a,b]=m.split("/").map(Number);const d=new Date(b,a-2,1);
  return dd(d.getMonth()+1)+"/"+d.getFullYear()}
function aliquotaVigente(m){
  const ap=aliquotaApurada(m); if(ap)return {a:ap,fonte:"apurada"};
  let p=mesAnterior(m);
  for(let i=0;i<6;i++){const x=aliquotaApurada(p); if(x)return {a:x,fonte:"provisionada",base:p}; p=mesAnterior(p)}
  return {a:FISCAL.aliquota,fonte:"padrão"};
}
function lancarGuia(mes,valor,venc){
  const v=numDeBRL(valor)||0; if(!v)return toast("Informe o valor da guia.");
  const ex=guiaDoMes(mes);
  if(ex){ex.valor=v;ex.venc=venc||ex.venc;ex.st="Lançada"}
  else GUIAS.push({mes,valor:v,venc:venc||"20/"+mesAnterior(mes).replace("/","/"),st:"Lançada"});
  const desc=`Guia do Simples · ${mes}`;
  if(!LANC.some(l=>l.desc===desc))
    LANC.push({d:"20/"+dd(+mes.slice(0,2)+1),desc,cat:"Impostos",cli:"",v,t:"despesa",st:"Previsto",nat:"operacional",forma:"Boleto",auto:true});
  montarHistorico();render();
  const a=aliquotaApurada(mes);
  toast(`Guia de ${mes} lançada. Alíquota apurada: ${a?(a*100).toFixed(2).replace(".",",")+"%":"—"}.`);
}
/* diferença entre o que foi provisionado e o que a guia cobrou */
function conferencia(mes){
  const g=guiaDoMes(mes); if(!g)return null;
  const prov=LANC.filter(l=>l.t==="receita"&&mesDe(l.d)===mes).reduce((a,l)=>a+impostoDe(l),0);
  return {guia:g.valor,prov,dif:Math.round((g.valor-prov)*100)/100};
}
/* RBT12 continua visível, mas só como informação de faixa */
function rbt12Info(mes){
  const r=rbt12(mes);
  return r?{rbt:r,falta:Math.max(0,360000-r),proxima:r>360000?"acima de R$ 360 mil":"até R$ 360 mil"}:null;
}
/* ===== período do financeiro, valendo para todas as abas ===== */
const PER_FIN=[["mes","Este mês"],["3m","Últimos 3 meses"],["6m","Últimos 6 meses"],["ano","Este ano"],["ano-1","Ano passado"],["custom","Intervalo"]];
function perFin(){return S.perFin||"mes"}
function setPerFin(v){S.perFin=v;render()}
function mesesDoPeriodo(p){
  const todos=HIST_MES.map(h=>h.mes);
  if(p==="mes")return ["09/2026"];
  if(p==="3m")return todos.slice(-3);
  if(p==="6m")return todos.slice(-6);
  if(p==="ano")return todos.filter(m=>m.endsWith("2026"));
  if(p==="ano-1")return todos.filter(m=>m.endsWith("2025"));
  if(p==="custom"){const de=S.perDe,ate=S.perAte;
    return todos.filter(m=>{const iso=m.slice(3)+"-"+m.slice(0,2);
      return (!de||iso>=de.slice(0,7))&&(!ate||iso<=ate.slice(0,7))})}
  return ["09/2026"];
}
function dadosPeriodo(p){
  const meses=mesesDoPeriodo(p);
  const ls=LANC.filter(l=>meses.includes(mesDe(l.d)));
  const rec=ls.filter(l=>l.t==="receita");
  const bruto=rec.reduce((a,l)=>a+l.v,0), taxa=rec.reduce((a,l)=>a+taxaDe(l),0);
  const imposto=rec.reduce((a,l)=>a+impostoDe(l),0);
  const desp=ls.filter(l=>l.t==="despesa"&&l.nat!=="retirada").reduce((a,l)=>a+l.v,0);
  return {meses,bruto,taxa,imposto,desp,liquido:bruto-taxa-imposto,res:bruto-taxa-imposto-desp};
}
function periodoAnterior(p){
  const meses=mesesDoPeriodo(p), n=meses.length;
  const todos=HIST_MES.map(x=>x.mes);
  const i=todos.indexOf(meses[0]);
  const ant=todos.slice(Math.max(0,i-n),i);
  if(!ant.length)return null;
  const ls=LANC.filter(l=>ant.includes(mesDe(l.d)));
  const rec=ls.filter(l=>l.t==="receita");
  const bruto=rec.reduce((a,l)=>a+l.v,0), taxa=rec.reduce((a,l)=>a+taxaDe(l),0);
  const imposto=rec.reduce((a,l)=>a+impostoDe(l),0);
  const desp=ls.filter(l=>l.t==="despesa"&&l.nat!=="retirada").reduce((a,l)=>a+l.v,0);
  return {meses:ant,bruto,liquido:bruto-taxa-imposto,desp,res:bruto-taxa-imposto-desp};
}
function variacao(agora,antes){
  if(!antes)return "";
  const pct=Math.round((agora-antes)/Math.abs(antes)*100);
  if(!isFinite(pct)||pct===0)return `<span class="hint">igual ao período anterior</span>`;
  const sobe=pct>0;
  return `<span class="hint" style="color:var(--${sobe?"success":"error"}-700)">${sobe?"▲":"▼"} ${Math.abs(pct)}% contra o período anterior</span>`;
}
function controlesPeriodo(){
  const p=perFin();
  return `<label class="filtro"><span>período</span>
      <select onchange="setPerFin(this.value)">${PER_FIN.map(([v,r])=>`<option value="${v}" ${p===v?"selected":""}>${r}</option>`).join("")}</select></label>
    ${p==="custom"?`<span class="filtro-int">
      <input class="data" type="date" value="${S.perDe||""}" onchange="S.perDe=this.value;render()">
      <span class="hint">até</span>
      <input class="data" type="date" value="${S.perAte||""}" onchange="S.perAte=this.value;render()"></span>`:""}
    <span class="hint" style="align-self:center">${mesesDoPeriodo(p).length===1?mesesDoPeriodo(p)[0]:mesesDoPeriodo(p).length+" meses · "+mesesDoPeriodo(p)[0]+" a "+mesesDoPeriodo(p).slice(-1)[0]}</span>`;
}

    <button class="btn sm u-fim" onclick="toast('Mês fechado vira só leitura. Mudança depois disso exige estorno.')">${ic("lock-key","sm")} Fechar setembro</button></div>`;

function previaGuia(){
  const m=document.getElementById("g-mes").value;
  const v=numDeBRL(document.getElementById("g-valor").value);
  const b=brutoDoMes(m);
  if(!v||!b)return msg("msg-guia","a alíquota é calculada sozinha a partir do valor informado","neutro");
  const a=v/b;
  const prov=LANC.filter(l=>l.t==="receita"&&mesDe(l.d)===m).reduce((x,l)=>x+impostoDe(l),0);
  const dif=v-prov;
  msg("msg-guia",`alíquota efetiva de <strong>${(a*100).toFixed(2).replace(".",",")}%</strong> sobre ${brl(b)}`+
    (Math.abs(dif)>1?` · diferença de ${brl(Math.abs(dif))} contra o provisionado`:" · bate com o provisionado"),
    Math.abs(dif)>50?"atencao":"ok");
}

function tomPrazoDia(dia,ref){
  if(ref){try{const d=porRef(ref).d;if(d.st==="concluido")return "ok"}catch(e){}}
  const hoje=23;
  if(dia<hoje)return "risco"; if(dia-hoje<=2)return "atencao"; return "neutro";
}
function calendarioHTML(){
  const inicio=2,total=30;
  const ativos=Object.keys(S.camadas).filter(k=>S.camadas[k]);
  let grade=DIAS.map(d=>`<div class="cal-h">${d}</div>`).join("");
  const antes=31;
  for(let i=0;i<inicio;i++)grade+=`<div class="cal-d fora"><div class="cal-n">${antes-inicio+1+i}</div></div>`;
  for(let dia=1;dia<=total;dia++){
    const its=EVENTOS.filter(e=>e.d===dia&&ativos.includes(e.cat)&&(!S.filtro||semAcento(e.t+e.c).includes(S.filtro)));
    const fds=((inicio+dia-1)%7===0||(inicio+dia-1)%7===6);
    grade+=`<div class="cal-d ${fds?"fds":""} ${dia===23?"hoje":""}"><div class="cal-n">${dia}</div>
      <div class="cal-itens">${its.map(e=>{
        const acao=e.ref?`S.sub=${e.sub!==undefined?e.sub:"null"};abrirDemanda('${e.ref}')`:e.plan?`abrirEditorPlan(${e.plan})`:null;
        const tom=e.tom||(e.cat==="prazo"?tomPrazoDia(e.d,e.ref):"neutro");
        const miolo=`${ic(ICO_CAT[e.cat],"sm")}<span class="cal-txt"><span>${e.t}</span>${e.c?`<span class="cal-sub">${e.c}</span>`:""}</span>`;
        return acao
          ?`<button class="cal-p" data-tom="${tom}" title="${e.t}${e.c?" · "+e.c:""}" onclick="${acao}">${miolo}</button>`
          :`<div class="cal-p" data-tom="${tom}" title="${e.t}${e.c?" · "+e.c:""}">${miolo}</div>`}).join("")}</div></div>`;
  }
  const usadas=inicio+total, sobra=(7-(usadas%7))%7;
  for(let i=1;i<=sobra;i++)grade+=`<div class="cal-d fora"><div class="cal-n">${i}</div></div>`;
  return `<div class="filtros">
      ${Object.entries(CATS).map(([k,r])=>`<button class="chip" aria-pressed="${!!S.camadas[k]}" onclick="S.camadas['${k}']=S.camadas['${k}']?0:1;render()">${ic(ICO_CAT[k],"sm")} ${r}</button>`).join("")}

    <div class="cal">${grade}</div>
    <div class="bloco" style="margin-top:14px;padding:14px 18px">
      <div class="bloco-t">Como ler</div>
      <div style="display:flex;gap:16px;flex-wrap:wrap">
        ${[["neutro","no prazo ou sem urgência"],["atencao","vence em até 2 dias"],["risco","atrasado ou vencido"],["espera","aguardando terceiro"],["ok","entregue, pago ou aprovado"]]
          .map(([t,r])=>`<span style="display:flex;gap:7px;align-items:center;font-size:var(--t-meta)">
            <span class="cal-am" data-tom="${t}"></span>${r}</span>`).join("")}
      </div>
      <div class="nota" class="u-mt1">A cor diz o estado, o ícone diz a categoria. O calendário não tem dados próprios: é uma visão sobre publicações, prazos, vencimentos, reuniões e contratos.</div></div>`;
}

function criarWiz(){
  const w=S.wiz, t=TEMPLATES.find(x=>x.id===w.tplId), c=cliente(w.cli);
  if(!t||!c)return toast("Falta escolher cliente e template.");
  if(w.tipo==="projeto"){
    const id=Math.max(...PROJETOS.map(p=>p.id))+1;
    const fimProj=somaDias(w.ini,t.demandas[t.demandas.length-1].dias);
    PROJETOS.push({id,nome:w.nome||t.nome,cli:c.id,tipo:t.nome,resp:w.resp,ini:w.ini,fim:fimProj,
      briefing:"",contrato:w.contrato>=0&&c.contratos[w.contrato]?`${c.contratos[w.contrato].n} · ${c.contratos[w.contrato].valor}`:"Sem contrato",template:t.nome,
      demandas:t.demandas.map(d=>{const pd=somaDias(w.ini,d.dias);
        return {t:d.t,st:"backlog",resp:[AREA_PESSOA[d.subs[0].cargo]||4],p:pd,desc:"",anexos:[],coment:[],
        ...(d.subs.length>1
          ?{subs:d.subs.map(x=>{const px=somaDias(w.ini,x.dias);
              return {t:x.t,resp:[AREA_PESSOA[x.cargo]||4],p:px,crit:"manual",itens:x.itens.map(i=>[i,AREA_PESSOA[x.cargo]||4,px,0])}})}
          :{itens:d.subs[0].itens.map(i=>[i,AREA_PESSOA[d.subs[0].cargo]||4,pd,0])})}})});
    fechar();S.tela="projetos";abrirProjeto(id);
    toast(`Projeto criado com ${t.demandas.length} demandas em Backlog.`);
  }else{
    const ct=c.contratos.filter(x=>x.t==="Recorrência")[w.contrato]||c.contratos[0];
    const vol=+(ct.escopo.match(/\d+/)?.[0])||t.pubs;
    const id=Math.max(...PLANEJ.map(p=>p.id))+1;
    const pubs=Array.from({length:vol},(_,i)=>`Publicação ${i+1}`);
    PLANEJ.push({id,cli:c.id,mes:w.mes,st:"rascunho",pubs:vol,
      demandas:[{t:`Planejamento de ${w.mes.toLowerCase()}`,st:"backlog",resp:[w.resps[0]||1],p:dataDoMes(w.mes,0),
        desc:`${t.nome} · ${vol} publicações contratadas.`,anexos:[],coment:[],
        subs:t.demandas[0].subs.map((x,i)=>{const px=dataDoMes(w.mes,x.diaMes,x.mesOff);
          return {t:x.t,resp:[w.resps[i]||1],p:px,crit:x.crit,
          itens:(x.crit!=="manual"||x.porPublicacao)?pubs.map(n=>[n,w.resps[i]||1,px,0]):x.itens.map(it=>[it,w.resps[i]||1,px,0])}})}]});
    fechar();S.tela="planejamentos";render();abrirPlanejamento(id);
    toast(`Planejamento criado com ${vol} publicações e ${t.demandas[0].subs.length} etapas.`);
  }
}

function calcParcela(){
  const v=numDeBRL((document.getElementById("p-valor")||{}).value||"");
  const n=+soNum((document.getElementById("p-parc")||{}).value)||1;
  msg("msg-parc",v?`${n}x de ${brl(Math.round(v/n))}`:"informe o valor","neutro");
}
function calcOrcamento(id){
  const campos=[...document.querySelectorAll("[data-area]")];
  const horas=campos.reduce((a,c)=>a+(+soNum(c.value)||0),0);
  const vh=numDeBRL((document.getElementById("s-hora")||{}).value)||120;
  const base=horas*vh;
  msg("msg-orc",horas?`${horas}h × ${brl(vh)} = <strong>${brl(base)}</strong> de valor base`:"informe as horas para calcular","neutro");
  const v=document.getElementById("s-v");
  if(v&&horas&&!v.dataset.tocado)v.value=mBRL(String(base*100));
}
function calcMargemServ(){
  const v=numDeBRL((document.getElementById("s-v")||{}).value), c=numDeBRL((document.getElementById("s-c")||{}).value);
  if(!v)return msg("msg-marg","informe o valor para calcular a margem","neutro");
  const pct=Math.round((v-c)/v*100);
  msg("msg-marg",`margem ${pct}% · ${brl(v-c)}`,pct>=50?"ok":pct>=40?"neutro":"risco");
}
function salvarServico(id,soTipo){
  const x=SERVICOS.find(s=>s.id===id), g=k=>document.getElementById(k);
  if(g("s-t"))x.t=g("s-t").value;
  if(soTipo){x.tpl=(TEMPLATES.find(t=>t.tipo===(x.t==="Recorrência"?"Planejamento":"Projeto"))||{}).nome||x.tpl;render();return verServico(id)}
  x.n=g("s-n").value; x.v=numDeBRL(g("s-v").value)||0; x.c=numDeBRL(g("s-c").value)||0;
  x.vigencia=g("s-vig").value; x.parcelas=+g("s-parc").value||1;
  x.tpl=g("s-tpl").value; x.desc=g("s-desc").value;
  fechar();render();toast("Serviço salvo.");
}

function duplicarServico(id){const x=SERVICOS.find(s=>s.id===id);

function rodarAutomacoes(){
  const feitos=[];
  // 1. planejamento do mês seguinte para cada fee sem planejamento
  if(autoOn("planMes")){
    CLIENTES.filter(c=>c.contratos.some(x=>x.t==="Recorrência"&&x.st!=="Encerrado")).forEach(c=>{
      const ja=PLANEJ.some(p=>p.cli===c.id&&p.mes==="Outubro");
      if(ja)return;
      const ct=c.contratos.find(x=>x.t==="Recorrência");
      const vol=+(ct.escopo.match(/\d+/)?.[0])||10;
      const tpl=TEMPLATES.find(t=>t.tipo==="Planejamento"&&(ct.escopo.includes("tráfego")?t.nome==="Mensal com tráfego":t.nome==="Planejamento mensal orgânico"));
      const pubs=Array.from({length:vol},(_,i)=>`Publicação ${i+1}`);
      const id=Math.max(...PLANEJ.map(p=>p.id))+1;
      PLANEJ.push({id,cli:c.id,mes:"Outubro",st:"rascunho",pubs:vol,
        demandas:[{t:"Planejamento de outubro",st:"backlog",resp:[1],p:dataDoMes("Outubro",0),
          desc:`${tpl.nome} · ${vol} publicações contratadas. Criado automaticamente pelo contrato ${ct.n}.`,anexos:[],coment:[],log:[{t:"Criado automaticamente pelo contrato de recorrência",a:4,q:agora()}],
          subs:tpl.demandas[0].subs.map(x=>{const px=dataDoMes("Outubro",x.diaMes,x.mesOff);
            return {t:x.t,resp:[AREA_PESSOA[x.cargo]||1],p:px,crit:x.crit,
              itens:(x.crit!=="manual"||x.porPublicacao)?pubs.map(n=>[n,AREA_PESSOA[x.cargo]||1,px,0]):x.itens.map(it=>[it,AREA_PESSOA[x.cargo]||1,px,0])}})}]});
      feitos.push(`Planejamento de outubro criado para ${c.nome}`);
    });
  }
  // 2. despesas recorrentes viram lançamento
  if(autoOn("recLanc")){
    RECORRENTES.filter(r=>r.st==="Ativa"&&r.per==="Mensal").forEach(r=>{
      const d=dd(r.dia)+"/10";
      if(LANC.some(l=>l.desc===r.desc&&l.d===d))return;
      LANC.push({d,desc:r.desc,cat:r.cat,cli:"",v:r.v,t:"despesa",st:"Previsto",auto:true});
      feitos.push(`${r.desc} lançada para ${d}`);
    });
  }
  // 3. relatório em rascunho
  if(autoOn("relRasc")){
    PLANEJ.filter(p=>p.st==="em_aprovacao"||p.st==="em_producao").forEach(p=>{
      if(RELATORIOS.some(r=>r.cli===p.cli&&r.mes===p.mes))return;
      const d=p.demandas[0], pub=(d.subs||[]).find(x=>x.t==="Publicação");
      const f=pub?pub.itens.filter(i=>i[3]).length:0;
      RELATORIOS.push({id:Math.max(...RELATORIOS.map(r=>r.id))+1,cli:p.cli,mes:p.mes,st:"Rascunho",envio:"",
        pubs:p.pubs,aprov:f,publicadas:f,rodadas:1.5,pontual:Math.round(f/p.pubs*100),
        alcance:"—",interacoes:"—",seguidores:"—",cliques:"—",
        serie:[],formatos:[],topo:[],destaques:[],proximos:[],leitura:"",auto:true});
      feitos.push(`Relatório de ${p.mes} aberto em rascunho para ${cliente(p.cli).nome}`);
    });
  }
  // 4. lead parado vira demanda
  if(autoOn("leadParado")){
    LEADS.filter(l=>l.dias>=10&&!["ganho","perdido"].includes(l.est)).forEach(l=>{
      const t=`Retomar contato com ${l.emp}`;
      const pj=PROJETOS[0];
      if(pj.demandas.some(d=>d.t===t))return;
      pj.demandas.push({t,st:"afazer",resp:[l.resp],p:"26/09",avulsa:true,
        desc:`Lead parado há ${l.dias} dias no estágio ${FUNIL.find(f=>f[0]===l.est)[1]}.`,
        itens:[],anexos:[],coment:[],log:[{t:"Criada automaticamente por lead parado",a:4,q:agora()}]});
      feitos.push(`Follow-up de ${l.emp} criado para ${USUARIOS.find(u=>u.id===l.resp).curto}`);
    });
  }
  render();
  return feitos;
}

function salvarProp(n){const p=PROPOSTAS.find(x=>x.n===n), g=k=>document.getElementById(k);

  if(antes.par!==p.parcelas)mud.push(`parcelas ${antes.par} para ${p.parcelas}`);
  if(antes.st!==p.st)mud.push(`situação ${antes.st} para ${p.st}`);

function pedirRevisao(id){const r=RELATORIOS.find(x=>x.id===id);
  if(!r.leitura.trim())return toast("Escreva a leitura estratégica antes de mandar para revisão.");
  r.st="Em revisão"; r.revisor=USUARIOS.find(u=>u.perfil==="Administrador").id; r.pedido=agora();
  S.notificacoes.unshift({t:"Relatório aguardando sua revisão",s:`${cliente(r.cli).nome} · ${r.mes}`,q:agora(),dia:"Hoje",cat:"producao",novo:true,para:[r.revisor],rel:r.id});
  render();toast(`Mandado para revisão de ${USUARIOS.find(u=>u.id===r.revisor).curto}.`);
}
function revisarRelatorio(id,ok){const r=RELATORIOS.find(x=>x.id===id);
  if(ok){r.st="Aprovado para envio";r.revisadoEm=agora();r.revisadoPor=S.eu;
    render();toast("Revisado. Agora dá para enviar ao cliente.")}
  else{r.st="Rascunho";r.revisadoEm=null;
    S.notificacoes.unshift({t:"Relatório voltou com pedido de ajuste",s:`${cliente(r.cli).nome} · ${r.mes}`,q:agora(),dia:"Hoje",cat:"producao",novo:true,para:[r.autor||1],rel:r.id});
    render();toast("Devolvido para ajuste.")}
}
function enviarRelatorio(id){const r=RELATORIOS.find(x=>x.id===id);
  if(!r.leitura.trim())return toast("Falta a leitura estratégica. Sem ela, o relatório é só uma planilha.");
  if(r.st!=="Aprovado para envio"&&r.st!=="Enviado")
    return toast("Este relatório ainda não passou pela revisão.");
  r.st="Enviado";r.envio=agora();render();
  toast("Relatório enviado ao cliente. O envio é manual nesta versão: avise pelo canal de sempre.");
}
function srcdocPlan(){
  const b=document.getElementById("plan-src").textContent.trim();
  const bin=atob(b), arr=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);
  return new TextDecoder("utf-8").decode(arr);
}

  if(m.tipo==="resumo"){
    S.planResumo=m;
    const pl=PLANEJ.find(x=>x.id===S.planAberto);
    if(pl){
      const d=pl.demandas[0], sub=(d.subs||[]).find(x=>x.t==="Publicação");

      if(m.total&&m.aprovadas===m.total&&pl.st!=="aprovado"){pl.st="aprovado";toast("Tudo aprovado. O planejamento fechou sozinho.")}
      else if(m.comCliente&&pl.st==="em_producao")pl.st="em_aprovacao";
    }
    if(S.tela==="editorplan")atualizarCardsPlan();
  }
});

  mandarPlan({tipo:"notas",valor:!off});
  const b=document.getElementById("b-notas");
  b.innerHTML=ic("warning-circle"); b.style.opacity=off?".4":"1";
  b.title=off?"Mostrar as explicações do protótipo":"Esconder as explicações do protótipo";
  toast(off?"Notas do protótipo escondidas.":"Notas do protótipo visíveis.");
}
function toggleTema(){
  setTimeout(()=>mandarPlan({tipo:"tema",valor:document.documentElement.getAttribute("data-theme")||"light"}),10);
  const r=document.documentElement;
  const escuro=r.getAttribute("data-theme")==="dark";
  r.setAttribute("data-theme",escuro?"light":"dark");
  document.getElementById("b-tema").innerHTML=ic(escuro?"sun":"moon");
}
function trocarUsuario(id){S.eu=+id;render();toast("Agora você é "+eu().curto+", "+eu().cargo.toLowerCase()+".")}
const semAcento=t=>String(t||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
function buscar(v){S.filtro=semAcento(v.trim());if(S.cli&&S.filtro)S.cli=null;render()}
function render(){
  document.getElementById("nav").innerHTML=navHTML();
  document.getElementById("avatar").innerHTML=avatar(S.eu,"md");
  const bm=document.getElementById("b-menu");
  if(bm&&!bm.innerHTML)bm.innerHTML=ic("list-checks");
  const bn=document.getElementById("b-notas");
  if(bn&&!bn.innerHTML.trim())bn.innerHTML=ic("warning-circle");
  document.getElementById("quem").innerHTML=USUARIOS.map(u=>`<option value="${u.id}" ${u.id===S.eu?"selected":""}>${u.nome} · ${u.cargo}</option>`).join("");
  const nn=notMinhas().filter(n=>n.novo).length;
  document.getElementById("n-not").textContent=nn||"";
  document.getElementById("n-not").style.display=nn?"":"none";
  const t=S.tela;
  document.getElementById("conteudo").innerHTML =
    t==="trabalho"?trabalhoHTML():
    t==="clientes"?(S.cli?clienteHTML():clientesHTML()):
    t==="planejamentos"?planejamentosHTML():
    t==="projetos"?(S.proj?projetoHTML():projetosHTML()):
    t==="leads"?leadsHTML():
    t==="propostas"?propostasHTML():
    t==="financeiro"?financeiroHTML():
    t==="calendario"?calendarioHTML():
    t==="time"?timeHTML():
    t==="inicio"?inicioHTML():
    t==="arquivos"?arquivosHTML():
    t==="config"?configHTML():
    t==="notificacoes"?notificacoesHTML():
    t==="relatorios"?(S.rel?relatorioHTML():relatoriosHTML()):
    t==="editorplan"?editorPlanHTML():
    t==="perfil"?perfilHTML():placeholderHTML();
  if(t==="editorplan")montarIframePlan();
}
function placeholderHTML(){
  return `<div class="vazio"><div style="font-size:13px">Tela ainda não desenhada</div>
    <div class="nota" style="margin-top:6px">O shell já funciona. A próxima tela entra aqui sem mexer no menu nem no header.</div></div>`;
}
function cardDemanda(o,comSel){
  const d=o.d, sub=minhaSub(d);
  const prazo=sub?sub.p:d.p;
  const f=sub?sub.itens.filter(i=>i[3]).length:feitosDe(d);
  const t=sub?sub.itens.length:totalDe(d);
  const concl=d.st==="concluido"||(t&&f===t);
  const tom=d.st==="cliente"?"espera":tomPrazo(prazo,concl);
  return cartao({tit:d.t,sub:`${avCliente(o.cliId,"xs")} <span>${o.cli} · ${o.ctxNome}</span>`,
    tags:[sub?[sub.t,"ativo"]:[ST_PROJ[d.st],TOM_ST[d.st]],[prazo,tom]]
      .concat(d.avulsa?[["avulsa","neutro"]]:[])
      .concat(d.subs&&!sub?[[d.subs.length+" etapas","neutro"]]:[]),
    f,t,tomBarra:tom==="risco"?"risco":tom==="atencao"?"atencao":concl?"ok":"ativo",
    respIds:(sub?sub.resp:respDe(d)),
    alerta:tom==="risco",click:`abrirDemanda('${o.ref}')`,
    sel:comSel?o.ref:null,marcado:comSel&&marcados().has(o.ref)});
}
function trabalhoHTML(){
  const f=filtrosDe("trabalho");
  const base=f.todos==="1"?todasDemandas().filter(o=>o.d.st!=="concluido"):minhas();
  let lista=base.filter(o=>!S.filtro||semAcento(o.d.t+o.cli+o.ctxNome).includes(S.filtro))
    .filter(o=>passa("trabalho",{cli:o.cliId,tipo:o.ctxTipo,st:o.d.st,resp:undefined}))
    .filter(o=>!f.resp||respDe(o.d).includes(+f.resp))
    .filter(o=>noPeriodo("trabalho",minhaSub(o.d)?minhaSub(o.d).p:o.d.p));
  lista=ordenar(lista,"trabalho",{t:o=>o.d.t,cli:o=>o.cli,prazo:o=>paraISO(minhaSub(o.d)?minhaSub(o.d).p:o.d.p),st:o=>o.d.st});
  const abertas=lista.length, atrasadas=lista.filter(x=>urgencia(x)==="atrasadas").length;
  const topo=barraFiltros("trabalho",[
      {k:"cli",rot:"cliente",ops:opsClientes()},
      {k:"tipo",rot:"origem",ops:[["projeto","projeto"],["planejamento","planejamento"]]},
      {k:"st",rot:"situação",ops:COLS},
      {k:"resp",rot:"responsável",ops:opsUsuarios(),todos:"eu"},
      {k:"todos",rot:"escopo",todos:"só o que é meu",ops:[["1","o time inteiro"]]},
      {periodoRot:"prazo em"}])
    +`<div class="filtros">
      <div class="seg"><button aria-pressed="${S.vistaTrab==="lista"}" onclick="S.vistaTrab='lista';render()">Lista</button><button aria-pressed="${S.vistaTrab==="kanban"}" onclick="S.vistaTrab='kanban';render()">Kanban</button></div>
      <span class="hint">${abertas} abertas${atrasadas?" · "+atrasadas+" atrasada"+(atrasadas>1?"s":""):""}</span>
    </div>`;
  if(!lista.length)return topo+vazio(`Tudo limpo, ${eu().curto}`,
    "Nenhuma demanda aberta com esses filtros. Isso é bom, ou é filtro demais.",
    "Nova demanda","criarDemandaRapida()","check");
  if(S.vistaTrab==="kanban"){
    const cols=[["atrasadas","Atrasadas"],["hoje","Hoje"],["semana","Esta semana"],["depois","Depois"]];
    return topo+`<div class="kb">${cols.map(([k,r])=>{const its=lista.filter(x=>urgencia(x)===k);
      return `<div class="kb-col"><div class="kb-t"><span>${r}</span><span>${its.length}</span></div>
        ${its.map(x=>cardDemanda(x)).join("")||'<div class="hint" style="padding:6px">vazio</div>'}</div>`}).join("")}</div>`;
  }
  return topo+barraMassa()+GRUPOS.map(([k,r])=>{const its=lista.filter(x=>urgencia(x)===k);
    if(!its.length)return "";
    return `<div class="grupo-t"><h2>${r}</h2><span class="hint">${its.length}</span></div>
      <div class="grade-cards">${its.map(x=>cardDemanda(x,true)).join("")}</div>`}).join("")
    ||vazio("Nada por aqui","Sem demanda aberta com esses filtros. Limpe os filtros ou crie uma demanda avulsa.","Nova demanda","criarDemandaRapida()","list-checks");
}
function fechar(){document.getElementById("overlay").innerHTML=""}
function toggleNot(){
  const o=document.getElementById("overlay");
  if(o.innerHTML.includes("painel-not")){o.innerHTML="";return}
  o.innerHTML=`<div class="scrim" style="background:transparent" onclick="fechar()"></div>
    <div class="painel-not">
      <div style="display:flex;justify-content:space-between;padding:10px 12px;border-bottom:1px solid var(--line)">
        <strong style="font-size:13px">Notificações</strong>
        <span style="display:flex;gap:6px"><button class="btn sm" onclick="lerTodas()">Marcar lidas</button>
        <button class="btn sm" onclick="fechar();ir('notificacoes','Notificações')">Ver todas</button></span></div>
      ${notMinhas().slice(0,6).map(n=>`<button class="not-i ${n.novo?"novo":""}" onclick="abrirNot(${S.notificacoes.indexOf(n)})">
        <div class="ph" style="width:28px;height:28px;border-radius:var(--r-pill);flex:none;border-style:solid">${ic({aprovacao:"check",mencao:"chat-circle-text",prazo:"clock",arquivo:"paperclip",financeiro:"wallet",comercial:"file-text"}[n.cat]||"bell","sm")}</div>
        <div><div style="font-size:13px">${n.t}</div><div class="hint">${n.s} · ${n.q}</div></div></button>`).join("")
        ||'<div class="hint" style="padding:14px">Nada para você agora.</div>'}
      <div class="nota" style="padding:10px 12px">Na v1 este é o único canal de aviso: o cliente continua sendo avisado por WhatsApp, manualmente.</div>
    </div>`;
}
function lerTodas(){S.notificacoes.forEach(n=>n.novo=false);fechar();render()}
let tt;function toast(m){clearTimeout(tt);let e=document.querySelector(".toast");
  if(!e){e=document.createElement("div");e.className="toast";e.setAttribute("role","status");e.setAttribute("aria-live","polite");document.body.appendChild(e)}
  e.textContent=m;tt=setTimeout(()=>e.remove&&e.remove(),3800)}
const digitando=()=>["INPUT","TEXTAREA","SELECT"].includes((document.activeElement||{}).tagName)||(document.activeElement||{}).isContentEditable;
document.addEventListener("keydown",e=>{
  if((e.metaKey||e.ctrlKey)&&e.key==="k"){e.preventDefault();S.paleta?fecharPaleta():paleta();return}
  if((e.metaKey||e.ctrlKey)&&e.key==="Enter"){const b=document.querySelector(".modal .btn.primary");if(b){e.preventDefault();b.click()}return}
  if((e.metaKey||e.ctrlKey)&&e.key==="z"&&window.__undo){e.preventDefault();window.__undo();return}
  if(e.key==="Escape"){if(S.paleta)fecharPaleta();else fechar();return}
  if(digitando())return;
  if(e.key==="/"){e.preventDefault();document.getElementById("q").focus();return}
  if(e.key==="n"||e.key==="N"){e.preventDefault();criarNaTela();return}
  if(e.key==="?"){e.preventDefault();atalhos();return}
});
function criarNaTela(){
  const mapa={trabalho:criarDemandaRapida,projetos:novoProjeto,planejamentos:novoPlanejamento,
    leads:()=>novoLead(),propostas:()=>toast("Nova proposta."),clientes:()=>toast("Novo cliente."),
    financeiro:()=>{S.abaFin="desp";render();novoLanc("despesa")}};
  (mapa[S.tela]||(()=>paleta()))();
}
function atalhos(){
  document.getElementById("overlay").innerHTML=`<div class="scrim" onclick="fechar()"></div>
    <div class="modal" style="width:min(520px,94vw)">
      <div class="mtopo"><div style="flex:1;font-size:var(--t-pagina);font-weight:600">Atalhos</div>
        <button class="btn sm" onclick="fechar()">${ic("x","sm")}</button></div>
      ${[["Cmd/Ctrl + K","paleta de comandos"],["/","busca global"],["N","criar na tela atual"],
         ["Cmd/Ctrl + Enter","salvar o modal aberto"],["Cmd/Ctrl + Z","desfazer a última exclusão"],
         ["Esc","fechar"],["?","esta lista"]].map(([k,r])=>`<div class="citem" style="grid-template-columns:150px 1fr">
        <kbd>${k}</kbd><span>${r}</span></div>`).join("")}
    </div>`;
}
seed();render();
